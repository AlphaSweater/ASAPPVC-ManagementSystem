name: CI • Build & Verify (.NET)

on:
  workflow_call: {}
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  FAIL_ON_CRITICAL_VULNS: 'true'

jobs:
  build-and-test:
    name: 🧪 Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # NuGet caching built-in + custom key for lock files
      - name: 🧰 Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/global.json

      # Reuse SonarQube binary/quality profiles cache between runs
      - name: ♻️ Cache SonarQube cache
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            sonar-${{ runner.os }}-

      # SonarScanner tool (fast, but we keep it non-blocking)
      - name: 🧭 Install SonarScanner (non-blocking)
        continue-on-error: true
        run: dotnet tool install --global dotnet-sonarscanner

      - name: ➕ Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # ── SonarQube BEGIN (report only)
      - name: 📡 SonarQube begin (report only)
        continue-on-error: true
        if: ${{ env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          dotnet-sonarscanner begin \
            /k:"AlphaSweater_ASAPPVC-Management_a00e5c53-35f0-4e1b-962f-423d84353d3c" \
            /d:sonar.host.url="${SONAR_HOST_URL}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/*/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="**/TestResults/*.trx" \
            /d:sonar.exclusions="**/wwwroot/**,**/*.generated.cs,**/bin/**,**/obj/**"

      # One pass: restore+build+test (parallel) + coverage + TRX
      - name: ✅ Test (parallel) with coverage
        run: |
          dotnet test --configuration Release \
            --logger "trx;LogFileName=tests.trx" \
            -p:CollectCoverage=true \
            -p:CoverletOutputFormat=opencover \
            -p:CoverletOutput=TestResults/coverage

      # ── SonarQube END (upload results)
      - name: 📤 SonarQube end (upload results)
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      # Optional “gate”—only on protected branches to keep PRs snappy
      - name: 🚦 Fail on CRITICAL/BLOCKER vulnerabilities (protected branches only)
        if: ${{ env.FAIL_ON_CRITICAL_VULNS == 'true' && (github.ref == 'refs/heads/production' || github.ref == 'refs/heads/development') }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          PROJECT_KEY: "AlphaSweater_ASAPPVC-Management_a00e5c53-35f0-4e1b-962f-423d84353d3c"
        shell: bash
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found; installing minimal..."
            sudo apt-get update -y >/dev/null 2>&1 && sudo apt-get install -y jq >/dev/null 2>&1
          fi

          deadline=$((SECONDS+120))
          in_progress=1
          while [ $SECONDS -lt $deadline ] && [ $in_progress -eq 1 ]; do
            resp=$(curl -sf -u "${SONAR_TOKEN}:" \
              "${SONAR_HOST_URL}/api/ce/component?componentKey=${PROJECT_KEY}" || true)
            status=$(echo "$resp" | jq -r '.current.status // "NONE"')
            if [ "$status" = "PENDING" ] || [ "$status" = "IN_PROGRESS" ]; then
              sleep 5
            else
              in_progress=0
            fi
          done

          issues=$(curl -sf -u "${SONAR_TOKEN}:" \
            --get "${SONAR_HOST_URL}/api/issues/search" \
            --data-urlencode "componentKeys=${PROJECT_KEY}" \
            --data-urlencode "types=VULNERABILITY" \
            --data-urlencode "severities=CRITICAL,BLOCKER" \
            --data-urlencode "resolved=false" | jq -r '.total // 0')

          echo "Serious vulnerability count: $issues"
          test "$issues" -eq 0