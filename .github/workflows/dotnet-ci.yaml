name: CI • Build, Test & SonarQube (.NET)

on:
  workflow_call: {}
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  PROJECT_KEY: 'AlphaSweater_ASAPPVC-ManagementSystem_59db2deb-b36c-49d4-b428-a7c72e5b71f2'
  FAIL_ON_CRITICAL_VULNS: 'true'

jobs:
  build-and-test:
    name: 🔍 Build, Test & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🧰 Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/global.json

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ♻️ Cache SonarQube analyzers
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            sonar-${{ runner.os }}-

      - name: 🧭 Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: ➕ Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: 📡 Initialize SonarQube Analysis
        # keep non-blocking so Sonar connectivity never breaks your PRs
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}   # e.g. https://sonar.yourdomain.tld
        run: |
          dotnet-sonarscanner begin \
            /k:"${PROJECT_KEY}" \
            /d:sonar.host.url="${SONAR_HOST_URL}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/*/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="**/TestResults/*.trx" \
            /d:sonar.exclusions="**/wwwroot/**,**/*.generated.cs,**/bin/**,**/obj/**" \
            /d:sonar.scanner.skipJreProvisioning=true

      - name: 🧪 Build & Run Tests
        run: |
          dotnet test --configuration Release \
            --logger "trx;LogFileName=tests.trx" \
            -p:CollectCoverage=true \
            -p:CoverletOutputFormat=opencover \
            -p:CoverletOutput=TestResults/coverage

      - name: 📤 Upload SonarQube Results
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      # Optional gate — only on protected branches, so feature branches stay fast
      - name: 🚦 Quality Gate
        if: ${{ env.FAIL_ON_CRITICAL_VULNS == 'true' && (github.ref == 'refs/heads/production' || github.ref == 'refs/heads/development') }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y >/dev/null 2>&1 && sudo apt-get install -y jq >/dev/null 2>&1
          fi

          deadline=$((SECONDS+120))
          in_progress=1
          while [ $SECONDS -lt $deadline ] && [ $in_progress -eq 1 ]; do
            resp=$(curl -sf -u "${SONAR_TOKEN}:" \
              "${SONAR_HOST_URL}/api/ce/component?componentKey=${PROJECT_KEY}" || true)
            status=$(echo "$resp" | jq -r '.current.status // "NONE"')
            if [ "$status" = "PENDING" ] || [ "$status" = "IN_PROGRESS" ]; then
              sleep 5
            else
              in_progress=0
            fi
          done

          issues=$(curl -sf -u "${SONAR_TOKEN}:" \
            --get "${SONAR_HOST_URL}/api/issues/search" \
            --data-urlencode "componentKeys=${PROJECT_KEY}" \
            --data-urlencode "types=VULNERABILITY" \
            --data-urlencode "severities=CRITICAL,BLOCKER" \
            --data-urlencode "resolved=false" | jq -r '.total // 0')

          echo "Serious vulnerability count: $issues"
          test "$issues" -eq 0