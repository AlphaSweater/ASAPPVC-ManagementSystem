name: CI • Build & Verify (.NET)

on:
  workflow_call: {}
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  # ───────────────────────────
  # Main CI
  # ───────────────────────────
  build-and-test:
    name: Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧰 Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🧾 Show .NET info
        run: dotnet --info

      - name: 📦 Restore NuGet packages
        run: dotnet restore --locked-mode

      - name: 🏗️ Build (Release)
        run: dotnet build --no-restore -c Release

      - name: 🔍 Discover test projects
        id: find_tests
        shell: bash
        run: |
          mapfile -t TESTS < <(git ls-files '*Tests.csproj' '*Test.csproj' '*.*.Tests.csproj' || true)
          if [ ${#TESTS[@]} -gt 0 ]; then
            printf '%s\n' "${TESTS[@]}" > tests.txt
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ✅ Run tests
        if: steps.find_tests.outputs.has_tests == 'true'
        run: |
          echo "Discovered test projects:"
          cat tests.txt
          while IFS= read -r proj; do
            echo "▶ dotnet test $proj"
            dotnet test "$proj" --no-build -c Release --logger "trx;LogFileName=test-results.trx"
          done < tests.txt

      - name: ℹ️ No tests yet — skipping
        if: steps.find_tests.outputs.has_tests != 'true'
        run: echo "No test projects found. Skipping tests successfully."