name: CI • Build & Verify (.NET)

on:
  push:
    branches: [ feature/**, bugfix/** ]
  pull_request:
    branches: [ production, development ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

# One active run per PR/branch; newest cancels older
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  PROJECT_PATH: 'ASAPPVC.UI/ASAPPVC.UI.csproj'

jobs:
  build-and-test:
    name: Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔎 Verify lock file present
        shell: bash
        run: |
          echo "Listing project directory: ASAPPVC.UI"
          ls -la ASAPPVC.UI || true
          if [ -f "ASAPPVC.UI/packages.lock.json" ]; then
            echo "Found ASAPPVC.UI/packages.lock.json"
          else
            echo "::error::ASAPPVC.UI/packages.lock.json not found. Generate and commit the lock file and push the branch. Example:"
            echo "   dotnet restore ./ASAPPVC.UI/ASAPPVC.UI.csproj"
            echo "   git add ASAPPVC.UI/packages.lock.json && git commit -m 'Add packages.lock.json'"
            git ls-files '*packages.lock.json' || true
            exit 1
          fi

      - name: 🧰 Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: 🧾 Show .NET info
        run: dotnet --info

      - name: 📦 Restore NuGet packages
        run: dotnet restore --locked-mode ${{ env.PROJECT_PATH }}

      - name: 🏗️ Build (Release)
        run: dotnet build --no-restore -c Release

      - name: 🔍 Discover test projects
        id: find_tests
        shell: bash
        run: |
          mapfile -t TESTS < <(git ls-files '*Tests.csproj' '*Test.csproj' '*.*.Tests.csproj' || true)
          if [ ${#TESTS[@]} -gt 0 ]; then
            printf '%s\n' "${TESTS[@]}" > tests.txt
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ✅ Run tests
        if: steps.find_tests.outputs.has_tests == 'true'
        run: |
          echo "Discovered test projects:"
          cat tests.txt
          while IFS= read -r proj; do
            echo "▶ dotnet test $proj"
            dotnet test "$proj" --no-build -c Release --logger "trx;LogFileName=test-results.trx"
          done < tests.txt

      - name: ℹ️ No tests yet — skipping
        if: steps.find_tests.outputs.has_tests != 'true'
        run: echo "No test projects found. Skipping tests successfully."