name: CI • Build & Verify (.NET)

on:
  push:
    branches: [ feature/**, bugfix/** ]
  pull_request:
    branches: [ production, development ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

# One active run per PR/branch; newest cancels older
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  # ───────────────────────────
  # Preflight: skip push CI if a PR is open for this branch
  # ───────────────────────────
  preflight:
    name: 🔎 Preflight (dedupe)
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.decide.outputs.run_ci }}
    steps:
      - name: 🔁 Decide if CI should run
        id: decide
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const isPush = context.eventName === 'push';
            let run = true;

            if (isPush) {
              const branch = context.ref.replace('refs/heads/', '');
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${branch}`
              });
              if (prs.length > 0) {
                core.info(`Open PR #${prs[0].number} exists for ${branch}. Skipping push CI (PR CI will run).`);
                run = false;
              } else {
                core.info(`No open PR for ${branch}. Running push CI.`);
              }
            } else {
              core.info('Event is pull_request/workflow_dispatch — running CI.');
            }

            core.setOutput('run_ci', run ? 'true' : 'false');

  # ───────────────────────────
  # Main CI
  # ───────────────────────────
  build-and-test:
    name: Build & Tests
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.run_ci == 'true'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧰 Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🧾 Show .NET info
        run: dotnet --info

      - name: 📦 Restore NuGet packages
        run: dotnet restore --locked-mode

      - name: 🏗️ Build (Release)
        run: dotnet build --no-restore -c Release

      - name: 🔍 Discover test projects
        id: find_tests
        shell: bash
        run: |
          mapfile -t TESTS < <(git ls-files '*Tests.csproj' '*Test.csproj' '*.*.Tests.csproj' || true)
          if [ ${#TESTS[@]} -gt 0 ]; then
            printf '%s\n' "${TESTS[@]}" > tests.txt
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ✅ Run tests
        if: steps.find_tests.outputs.has_tests == 'true'
        run: |
          echo "Discovered test projects:"
          cat tests.txt
          while IFS= read -r proj; do
            echo "▶ dotnet test $proj"
            dotnet test "$proj" --no-build -c Release --logger "trx;LogFileName=test-results.trx"
          done < tests.txt

      - name: ℹ️ No tests yet — skipping
        if: steps.find_tests.outputs.has_tests != 'true'
        run: echo "No test projects found. Skipping tests successfully."