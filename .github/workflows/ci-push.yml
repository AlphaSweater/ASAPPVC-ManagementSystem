name: CI • Push Build & Verify (.NET)

on:
  push:
    branches: [ production, development, feature/**, bugfix/** ]

concurrency:
  group: ci-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  preflight:
    name: 🔎 Preflight (skip if PR open)
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.decide.outputs.run_ci }}
    steps:
      - name: 🔁 Decide if CI should run
        id: decide
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`
            });
            const run = prs.length === 0;
            core.info(prs.length
              ? `Open PR #${prs[0].number} for ${branch} → skip push CI (PR CI will run).`
              : `No open PR for ${branch} → run push CI.`);
            core.setOutput('run_ci', run ? 'true' : 'false');

  call-reusable:
    name: 🏃 Push CI (only if no PR)
    needs: preflight
    if: needs.preflight.outputs.run_ci == 'true'
    uses: ./.github/workflows/dotnet-ci.yaml
