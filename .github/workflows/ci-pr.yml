name: CI • PR Build & Verify (.NET)

on:
  pull_request:
    branches: [ production, development ]
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  call-reusable:
    name: 🚦 PR CI
    uses: ./.github/workflows/dotnet-ci.yaml
    secrets: inherit
